name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|Could not resolve|error:" -A4 build.log | head -80
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
