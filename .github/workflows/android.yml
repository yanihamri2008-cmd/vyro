name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Prepare signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signed release build"
          else
            echo "No signing key found: debug build"
          fi
      - name: Build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle :app:assembleRelease :app:bundleRelease --console=plain 2>&1 | tee build.log
          else
            gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
          fi
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | sed 's|file:///home/runner/work/vyro/vyro/||' | head -15 > errors.txt || true
          if [ ! -s errors.txt ]; then grep -E "What went wrong|Could not resolve|error:" -A4 build.log | head -40 > errors.txt || true; fi
          { echo "### Build errors"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r l; do echo "::error::${l}"; done < errors.txt
          cat errors.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyro-apk
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyro-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
