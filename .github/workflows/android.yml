name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | sed 's|file:///home/runner/work/vyro/vyro/||' | head -15 > errors.txt || true
          if [ ! -s errors.txt ]; then grep -E "What went wrong|Could not resolve|error:" -A4 build.log | head -40 > errors.txt || true; fi
          { echo "### Build errors"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r l; do echo "::error::${l}"; done < errors.txt
          cat errors.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
