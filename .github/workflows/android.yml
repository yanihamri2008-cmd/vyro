name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Prepare signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signed release build"
          else
            echo "No signing key found: debug build"
          fi
      - name: Verify signing key
        if: env.KEYSTORE_PATH != ''
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          fail() { echo "::error::RESULT: $1"; echo "RESULT: $1"; exit 1; }
          [ -z "$KEYSTORE_PASSWORD" ] && fail "KEYSTORE_PASSWORD secret is missing or empty"
          [ -z "$KEY_ALIAS" ] && fail "KEY_ALIAS secret is missing or empty"
          [ -z "$KEY_PASSWORD" ] && fail "KEY_PASSWORD secret is missing or empty"
          echo "keystore file size: $(wc -c < "$KEYSTORE_PATH") bytes"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" > /tmp/l.txt 2>&1; then
            head -3 /tmp/l.txt
            fail "KEYSTORE_B64 is corrupt/incomplete OR KEYSTORE_PASSWORD is wrong"
          fi
          echo "RESULT: store password OK"
          grep -E "Keystore type|Your keystore contains" /tmp/l.txt || true
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/a.txt 2>&1; then
            fail "KEY_ALIAS does not match the alias inside the keystore (should be: vyro)"
          fi
          echo "RESULT: alias OK"
          if ! keytool -importkeystore -srckeystore "$KEYSTORE_PATH" -destkeystore /tmp/t.p12 -deststoretype PKCS12 \
               -srcalias "$KEY_ALIAS" -srcstorepass "$KEYSTORE_PASSWORD" -srckeypass "$KEY_PASSWORD" \
               -deststorepass tmp12345 -noprompt > /tmp/k.txt 2>&1; then
            fail "KEY_PASSWORD is wrong (it must equal the key password you typed in keytool)"
          fi
          echo "RESULT: key password OK"
      - name: Build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle :app:assembleRelease :app:bundleRelease --console=plain 2>&1 | tee build.log
          else
            gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
          fi
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | sed 's|file:///home/runner/work/vyro/vyro/||' | head -15 > errors.txt || true
          if [ ! -s errors.txt ]; then grep -E "What went wrong|Could not resolve|error:" -A4 build.log | head -40 > errors.txt || true; fi
          { echo "### Build errors"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r l; do echo "::error::${l}"; done < errors.txt
          cat errors.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyro-apk
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vyro-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
